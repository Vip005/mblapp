appId: com.afss05steam.freshmart
---
- launchApp
# Add item from product details or listing
- extendedWaitUntil:
    visible: "Add to Cart"
    timeout: 8000
- tapOn: "Add to Cart"
# Quantity increment
- extendedWaitUntil:
    visible: "+"
    timeout: 3000
- tapOn: "+"
# Open Cart screen via Bottom Tab
- tapOn: "Cart"
- extendedWaitUntil:
    visible: "Bill Details"
    timeout: 8000
- assertVisible: "Item Total"
- assertVisible: "Grand Total"
- assertVisible: "Proceed to Checkout"
